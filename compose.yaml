# LEMIT 컨테이너 구성 (#5): web(Django + gunicorn) + db(PostgreSQL 18).
#
# - 이 파일은 공통·운영 기준이다. DB 포트를 열지 않고, web도 서버 안(127.0.0.1)에서만 연다.
#   인터넷 공개는 TLS 리버스 프록시를 둔 뒤에 한다 (#7, OPERATIONS §2).
# - 이 파일만으로 실행하면 운영 구성이다:  docker compose up -d --wait  (= docker compose -f compose.yaml up -d --wait)
# - 개발 PC에서는 개발 설정을 직접 덧붙인다:  docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
#   (DB 포트 공개·코드 마운트·runserver. 자동으로 읽히는 compose.override.yaml은 쓰지 않는다, PR #39 리뷰)
# - 운영에서 docker compose down -v 는 DB 볼륨을 지우므로 쓰지 않는다 (CI의 down -v는 임시 환경 정리용).
# - .env의 POSTGRES_PASSWORD는 URL에 그대로 들어가므로 영문·숫자·-_ 만 쓴다 (secrets.token_urlsafe 권장).
name: lemit

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    # 배포 시 IMAGE_TAG에 커밋 SHA를 넣어 이미지를 구분하고, 롤백은 이전 태그로 다시 실행한다 (#7)
    image: lemit-web:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      # 컨테이너 안에서 127.0.0.1은 자기 자신이므로 DB 호스트는 서비스 이름 db (PR #29 리뷰).
      # .env의 DATABASE_URL(PC 실행용 127.0.0.1)을 여기서 덮어쓴다.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # TLS 리버스 프록시 (#7). 운영 서버에서만:  docker compose --profile proxy up -d --wait
  # 인터넷에 여는 포트는 이 서비스의 80/443뿐이다. web(8000)·db(5432)는 외부에 열지 않는다.
  proxy:
    image: caddy:2.10-alpine
    profiles: ["proxy"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # 발급받은 인증서 (지우면 재발급 제한에 걸릴 수 있음)
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
