# 개발 PC 전용 설정. `docker compose up`을 하면 compose.yaml과 자동으로 합쳐진다. 운영 서버에서는 쓰지 않는다.
services:
  db:
    # PC의 Python 가상환경에서 Django를 실행할 때 접속할 수 있도록 PC 안(127.0.0.1)에만 연다
    ports:
      - "127.0.0.1:5432:5432"

  web:
    # 코드를 마운트하고 runserver로 실행해 수정하면 바로 반영되게 한다
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "True"
