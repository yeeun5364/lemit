# 개발 PC 전용 설정. 자동으로 읽히지 않는 이름이라 개발할 때만 직접 지정한다 (PR #39 리뷰: 운영에서 실수로 적용 방지).
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
# 운영 서버에서는 절대 지정하지 않는다 (DEBUG=True, runserver, 소스 마운트, DB 포트 공개).
services:
  db:
    # PC의 Python 가상환경에서 Django를 실행할 때 접속할 수 있도록 PC 안(127.0.0.1)에만 연다
    ports:
      - "127.0.0.1:5432:5432"

  web:
    # 코드를 마운트하고 runserver로 실행해 수정하면 바로 반영되게 한다
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "True"
