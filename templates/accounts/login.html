{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block auth_content %}
<section class="card auth-card" aria-labelledby="auth-title">
  <h1 id="auth-title" class="auth-title">로그인</h1>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="errorlist nonfield" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
    {% for field in form %}{% include "ui/field.html" %}{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
  <p class="auth-links">처음이신가요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
