{% extends "base.html" %}
{% block title %}수강생 메시지 추가{% endblock %}
{% block content %}
<div class="page-head">
  <a class="back" href="{% url 'inbox:list' %}">&lt; 메시지함</a>
</div>
<h1 class="page-title">수강생 메시지 추가</h1>
<p class="notice">시연용 화면입니다. 수강생 계정이 없는 MVP에서 수강생이 보낸 메시지를 대신 등록하면, 직접 학습시킨 AI 모델이 휴강·보강·일정 변경·일반 메시지로 분류합니다. 같은 수강생·같은 제목이면 기존 대화에 이어 붙습니다.</p>

<form method="post" class="form" novalidate>
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit" class="button-primary">저장하고 분류</button>
</form>
{% endblock %}
