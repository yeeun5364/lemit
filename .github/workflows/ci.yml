name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: 워크플로 검사 (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Self-hosted 러너 사용 규칙 (deploy.yml만, PR 트리거 금지, #56)
        run: python scripts/check_workflow_policy.py
      - name: 배포 스크립트 테스트 (방화벽 계산·ci_deploy 입력·main 포함 검증·배포 잠금·워크플로 규칙, #42·#56)
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          bash scripts/test_ci_deploy.sh
          bash scripts/test_deploy_lock.sh

  test:
    name: 테스트 (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: lemit
          POSTGRES_USER: lemit
          POSTGRES_PASSWORD: lemit-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lemit -d lemit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 전용 값. 실제 비밀값이 아니며 CI 안에서만 쓰인다.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://lemit:lemit-ci@127.0.0.1:5432/lemit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 설정 점검
        run: python manage.py check
      - name: 마이그레이션 누락 확인
        run: python manage.py makemigrations --check --dry-run
      - name: ML 모델 검증 (파일·버전·데이터 일치, 점수 재현, 성능 기준)
        run: python -m ml.verify
      - name: 테스트
        run: python manage.py test --noinput -v 2

  docker:
    name: Docker 이미지 (빌드·스모크)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: CI용 .env 만들기 (실제 비밀값 아님, CI 안에서만 사용)
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=203.0.113.10,localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS=
          POSTGRES_DB=lemit
          POSTGRES_USER=lemit
          POSTGRES_PASSWORD=lemit-ci
          DATABASE_URL=postgres://lemit:lemit-ci@127.0.0.1:5432/lemit
          SITE_ADDRESS=:80
          DJANGO_BEHIND_PROXY=True
          DJANGO_SECURE_HTTPS=False
          PROXY_HTTP_PORT=8080
          PROXY_HTTPS_PORT=8443
          EOF
      - name: 배포 사전 점검 시나리오 (잘못된 운영 .env 조합 차단)
        run: bash scripts/test_preflight.sh
      - name: 서버 점검 포트 판정 시나리오 (DB·web이 loopback 밖에 열리면 필수 실패)
        run: bash scripts/test_server_check.sh
      - name: 이미지 빌드
        run: docker compose -f compose.yaml build web
      - name: 컨테이너 기동 (db·web이 healthy가 될 때까지 대기)
        run: docker compose -f compose.yaml up -d --wait
      - name: 마이그레이션
        run: docker compose -f compose.yaml exec -T web python manage.py migrate --noinput
      - name: 스모크 테스트 (healthz·모델 상태·check·migrate --check·ml.verify·추론 1건)
        run: docker compose -f compose.yaml exec -T web python scripts/smoke_test.py
      - name: 배포 스크립트 성공 시나리오 (프록시 포함, check --deploy·스모크·공개 경로 확인 후에만 OK)
        run: |
          DEPLOY_SKIP_GIT=1 bash scripts/deploy.sh
          test "$(cat deploy/state/current_tag)" = "$(git rev-parse --short=12 HEAD)"
          tail -1 deploy/state/history.log | grep -q $'	OK$'
      - name: 공개 경로 실패 시나리오 (OK로 기록하지 않고 current_tag 유지)
        run: |
          git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m "ci scenario"
          BEFORE="$(cat deploy/state/current_tag)"
          if PUBLIC_CHECK_HTTP_PORT=9 PUBLIC_CHECK_RETRIES=2 PUBLIC_CHECK_DELAY=1 DEPLOY_SKIP_GIT=1 bash scripts/deploy.sh; then
            echo "공개 경로가 실패했는데 배포가 성공으로 끝났습니다"; exit 1
          fi
          test "$(cat deploy/state/current_tag)" = "$BEFORE"
          tail -1 deploy/state/history.log | grep -q FAILED_PUBLIC_CHECK
      - name: DB 백업 → 임시 DB 복원 점검 (#44)
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          docker compose exec -T web python manage.py shell -c "
          from accounts.models import User
          User.objects.create_user(email='ci-backup@example.com', password='ci-only-pass-2026!', name='백업점검')"
          bash scripts/backup_db.sh
          bash scripts/restore_check.sh
          latest="$(find "$BACKUP_DIR" -maxdepth 1 -name 'lemit-*.dump' | sort | tail -n 1)"
          head -c 4000 "$latest" > "$RUNNER_TEMP/broken.dump"
          if bash scripts/restore_check.sh "$RUNNER_TEMP/broken.dump"; then echo "깨진 백업인데 점검이 통과했습니다"; exit 1; fi
          docker compose exec -T db psql -U lemit -d postgres -qAt -c "SELECT count(*) FROM pg_database WHERE datname LIKE 'lemit\_rc\_%'" | grep -qx 0
      - name: 복원 점검 안전성 - 기존 DB 보존·동시 실행 (#46 리뷰)
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: bash scripts/test_restore_check.sh
      - name: 프록시 중단 시나리오 (공개 경로 확인이 실패해야 함)
        run: |
          docker compose --profile proxy stop proxy
          if PUBLIC_CHECK_RETRIES=2 PUBLIC_CHECK_DELAY=1 bash scripts/check_public.sh; then exit 1; fi
          docker compose --profile proxy start proxy
          PUBLIC_CHECK_RETRIES=6 PUBLIC_CHECK_DELAY=2 bash scripts/check_public.sh
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose --profile proxy logs --no-color --tail 200
      - name: 정리 (CI 임시 환경이라 볼륨까지 삭제. 운영에서는 down -v 금지)
        if: always()
        run: docker compose --profile proxy down -v
