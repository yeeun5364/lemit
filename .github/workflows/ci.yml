name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: 테스트 (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: lemit
          POSTGRES_USER: lemit
          POSTGRES_PASSWORD: lemit-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lemit -d lemit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 전용 값. 실제 비밀값이 아니며 CI 안에서만 쓰인다.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://lemit:lemit-ci@127.0.0.1:5432/lemit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 설정 점검
        run: python manage.py check
      - name: 마이그레이션 누락 확인
        run: python manage.py makemigrations --check --dry-run
      - name: 테스트
        run: python manage.py test --noinput -v 2
