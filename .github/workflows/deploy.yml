name: Deploy

# Lightsail 배포 (#42). 사용자가 직접 할 AWS·GitHub·서버 설정은 docs/CD.md.
# - 자동: main에 push된 커밋의 CI가 성공하면 배포한다. 저장소 변수 CD_AUTO_DEPLOY가 "true"일 때만 (처음엔 꺼 둠).
# - 수동: Actions → Deploy → Run workflow. check(연결만 확인) / deploy / rollback
# - SSH 22번은 평소 관리자 IP만 허용. 배포하는 동안만 이 러너 IP를 22번 규칙에 추가하고, 끝나면 그 IP만 뺀다.
# - AWS 인증은 GitHub OIDC → IAM 역할 (장기 AWS 키 없음). 서버 접속은 배포 전용 키 + 호스트 키 검증.
# - 공개 저장소라 Actions 로그는 누구나 볼 수 있다. 방화벽 규칙(관리자 IP)·키·.env 내용은 출력하지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "check: 방화벽·SSH 연결만 확인 / deploy: 배포 / rollback: 이전 이미지로"
        type: choice
        options: [check, deploy, rollback]
        default: check
      sha:
        description: "deploy할 커밋 SHA 40자리 (비우면 main 최신 커밋)"
        required: false
        default: ""
      rollback_tag:
        description: "rollback할 이미지 태그 12자리 (서버 deploy/state/history.log 또는 check 결과 참고)"
        required: false
        default: ""

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않고 다음 배포를 기다리게 한다 (서버에도 flock 잠금이 있음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 배포 (Lightsail)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CD_AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      checks: read
      id-token: write   # OIDC로 AWS 역할을 받기 위해 필요
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE_NAME }}
      HOST: ${{ vars.LIGHTSAIL_HOST }}
      SSH_USER: ${{ vars.LIGHTSAIL_USER }}
    steps:
      # 워크플로가 쓰는 스크립트는 항상 main 기준 (다른 브랜치를 골라 실행해도 main의 스크립트를 씀)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 설정값 확인
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
          HAS_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY != '' }}
        run: |
          missing=""
          for v in AWS_REGION INSTANCE HOST SSH_USER ROLE KNOWN_HOSTS; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ "$HAS_KEY" = "true" ] || missing="$missing LIGHTSAIL_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::production Environment 설정이 빠졌습니다:$missing (docs/CD.md §4)"; exit 1
          fi

      - name: 요청 정하기 (동작·대상 검증)
        id: req
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_ACTION: ${{ inputs.action }}
          IN_SHA: ${{ inputs.sha }}
          IN_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then ACTION=deploy; SHA="$RUN_SHA"; TAG=""
          else ACTION="$IN_ACTION"; SHA="$IN_SHA"; TAG="$IN_TAG"; fi
          case "$ACTION" in
            deploy)
              [ -n "$SHA" ] || SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA는 소문자 40자리여야 합니다"; exit 1; }
              REMOTE="deploy $SHA" ;;
            rollback)
              [[ "$TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::rollback_tag는 소문자 12자리여야 합니다"; exit 1; }
              REMOTE="rollback $TAG" ;;
            check) REMOTE="status" ;;
            *) echo "::error::알 수 없는 동작: $ACTION"; exit 1 ;;
          esac
          { echo "action=$ACTION"; echo "sha=$SHA"; echo "remote=$REMOTE"; } >> "$GITHUB_OUTPUT"
          echo "동작: $ACTION / 서버 요청: $REMOTE"

      # 테스트를 통과한 main의 커밋만 배포한다
      - name: CI 통과·main 포함 확인
        if: steps.req.outputs.action == 'deploy'
        env:
          SHA: ${{ steps.req.outputs.sha }}
        run: |
          status="$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)"
          case "$status" in identical|ahead) ;; *) echo "::error::$SHA 는 main에 포함된 커밋이 아닙니다 ($status)"; exit 1 ;; esac
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | "\(.name)\t\(.conclusion)"' > runs.txt
          for name in "린트 (ruff)" "테스트 (PostgreSQL 18)" "Docker 이미지 (빌드·스모크)"; do
            if ! grep -qxF "$name"$'\t'"success" runs.txt; then
              echo "::error::$SHA 의 CI '$name' 이(가) 성공하지 않았습니다"; cat runs.txt; exit 1
            fi
          done
          echo "CI 3개 작업 모두 성공, main에 포함된 커밋"

      - name: AWS 인증 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 러너 공인 IP 확인
        id: ip
        run: |
          ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::러너 IP를 알 수 없습니다"; exit 1; }
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
          echo "러너 IP: $ip"

      - name: SSH 22번에 러너 IP 임시 추가
        id: open
        env:
          CIDR: ${{ steps.ip.outputs.cidr }}
        run: |
          aws lightsail get-instance-port-states --instance-name "$INSTANCE" > before.json
          python3 scripts/lightsail_firewall.py open --cidr "$CIDR" < before.json > open.json
          echo "opened=true" >> "$GITHUB_OUTPUT"
          aws lightsail put-instance-public-ports --instance-name "$INSTANCE" --port-infos file://open.json > /dev/null
          echo "22번 규칙에 러너 IP를 추가했습니다 (기존 규칙은 그대로 유지, 내용은 로그에 출력하지 않음)"

      - name: SSH 준비 (배포 전용 키, 호스트 키 검증)
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/lemit_deploy)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/lemit_known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/lemit_known_hosts > /dev/null \
            || { echo "::error::LIGHTSAIL_KNOWN_HOSTS에 $HOST 의 호스트 키가 없습니다 (docs/CD.md §2)"; exit 1; }

      - name: 서버에서 실행 (${{ steps.req.outputs.action }})
        env:
          REMOTE: ${{ steps.req.outputs.remote }}
        run: |
          SSH=(ssh -i ~/.ssh/lemit_deploy -o IdentitiesOnly=yes -o BatchMode=yes
               -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/lemit_known_hosts"
               -o ConnectTimeout=10 -o ServerAliveInterval=30 "$SSH_USER@$HOST")
          # 방화벽 규칙이 반영될 때까지 잠깐 기다리며 연결 확인
          for i in 1 2 3 4 5 6; do
            "${SSH[@]}" status > /dev/null 2>&1 && break
            [ "$i" = 6 ] && { echo "::error::SSH 연결 실패 (방화벽·호스트 키·배포 키·authorized_keys 확인, docs/CD.md)"; exit 1; }
            sleep 5
          done
          "${SSH[@]}" "$REMOTE"

      # 성공·실패·취소와 관계없이 반드시: 그 시점의 최신 방화벽 상태에서 러너 IP만 뺀다
      - name: SSH 22번에서 러너 IP 제거
        if: always() && steps.open.outputs.opened == 'true'
        env:
          CIDR: ${{ steps.ip.outputs.cidr }}
        run: |
          aws lightsail get-instance-port-states --instance-name "$INSTANCE" > now.json
          python3 scripts/lightsail_firewall.py close --cidr "$CIDR" < now.json > close.json
          aws lightsail put-instance-public-ports --instance-name "$INSTANCE" --port-infos file://close.json > /dev/null
          aws lightsail get-instance-port-states --instance-name "$INSTANCE" > after.json
          if grep -qF "\"$CIDR\"" after.json; then echo "::error::러너 IP가 방화벽에 남아 있습니다. Lightsail 콘솔에서 22번 규칙을 확인하세요"; exit 1; fi
          echo "러너 IP를 22번 규칙에서 제거했습니다"

      - name: 정리 (키·방화벽 상태 파일 삭제)
        if: always()
        run: rm -f ~/.ssh/lemit_deploy before.json open.json now.json close.json after.json runs.txt

      - name: 요약
        if: always()
        env:
          ACTION: ${{ steps.req.outputs.action }}
          SHA: ${{ steps.req.outputs.sha }}
          REMOTE: ${{ steps.req.outputs.remote }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### 배포 결과: $STATUS"
            echo "- 동작: \`$ACTION\`"
            echo "- 서버 요청: \`$REMOTE\`"
            [ -n "$SHA" ] && echo "- 커밋: \`$SHA\`"
            echo "- 서버 기록: \`deploy/state/history.log\` (check 동작으로 확인 가능)"
          } >> "$GITHUB_STEP_SUMMARY"
