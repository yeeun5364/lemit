name: Deploy

# Lightsail 배포 (#42 → #56 Self-hosted Runner). 사용자가 직접 할 설정과 남는 위험은 docs/CD.md.
# - 자동: main에 push된 커밋의 CI가 성공하면 배포한다. 저장소 변수 CD_AUTO_DEPLOY가 "true"일 때만 (처음엔 꺼 둠).
# - 수동: Actions → Deploy → Run workflow (main에서만). check(연결만 확인) / deploy / rollback
#
# 두 작업으로 나눈다:
#   1) plan   (GitHub-hosted): 요청 검증, 그 커밋의 실제 CI 실행(ci.yml, main push)과 3개 작업 성공 확인. 판단은 여기서.
#   2) deploy (Self-hosted, 러너 전용 WSL 배포판): 러너 격리 확인 → SSH 요청 한 줄. 저장소 코드·외부 액션은 받지 않는다.
#      서버는 배포 전용 키의 강제 명령(/usr/local/bin/lemit-ci-deploy = scripts/ci_deploy.sh 설치본)만 실행한다.
#
# 공개 저장소에서 Self-hosted 러너를 쓰므로 위험을 줄이는 장치이며 완전한 차단은 아니다 (docs/CD.md §1):
# - PR·push 트리거를 두지 않는다. self-hosted는 이 파일의 deploy 작업만 쓴다 (scripts/check_workflow_policy.py가 CI에서 검사).
#   포크 PR은 자기 워크플로 파일로 실행되므로, 그 경우는 저장소 설정 '모든 외부 기여자 승인'에 의존한다.
# - 러너 PC의 공인 IP가 Lightsail SSH 22번에 허용된 관리자 IP라는 전제다. AWS 권한은 러너에 두지 않는다.
# - 공개 로그에 키·.env·방화벽 규칙을 출력하지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "check: 서버 연결·상태만 확인 / deploy: 배포 / rollback: 이전 이미지로"
        type: choice
        options: [check, deploy, rollback]
        default: check
      sha:
        description: "deploy할 커밋 SHA 40자리 (비우면 main 최신 커밋)"
        required: false
        default: ""
      rollback_tag:
        description: "rollback할 이미지 태그 12자리 (서버 deploy/state/history.log 또는 check 결과 참고)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: 배포 요청 검증 (GitHub-hosted)
    if: >-
      github.repository == 'yeeun5364/lemit' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        vars.CD_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      action: ${{ steps.req.outputs.action }}
      sha: ${{ steps.req.outputs.sha }}
      remote: ${{ steps.req.outputs.remote }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: 요청 정하기 (동작·대상 검증)
        id: req
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_ACTION: ${{ inputs.action }}
          IN_SHA: ${{ inputs.sha }}
          IN_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then ACTION=deploy; SHA="$RUN_SHA"; TAG=""
          else ACTION="$IN_ACTION"; SHA="$IN_SHA"; TAG="$IN_TAG"; fi
          # 자동 배포인데 그사이 main에 더 새 커밋이 있으면 여기서 끝낸다 (deploy 작업이 대기열에 들어가
          # 기다리던 rollback 등을 밀어내지 않게, PR #58 리뷰 P2). 러너도 실행 직전에 한 번 더 확인한다.
          if [ "$EVENT" = "workflow_run" ]; then
            head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$head" != "$SHA" ]; then
              echo "::notice::main에 더 새 커밋이 있어 이 자동 배포는 건너뜁니다. 새 커밋의 CI가 성공하면 배포됩니다."
              { echo "action=skip"; echo "sha="; echo "remote="; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$ACTION" in
            deploy)
              [ -n "$SHA" ] || SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA는 소문자 40자리여야 합니다"; exit 1; }
              REMOTE="deploy $SHA" ;;
            rollback)
              [[ "$TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::rollback_tag는 소문자 12자리여야 합니다"; exit 1; }
              SHA=""; REMOTE="rollback $TAG" ;;
            check) SHA=""; REMOTE="status" ;;
            *) echo "::error::알 수 없는 동작"; exit 1 ;;
          esac
          # 출력에는 검증을 통과한 값만 쓴다 (deploy가 아니면 SHA는 비움)
          { echo "action=$ACTION"; echo "sha=$SHA"; echo "remote=$REMOTE"; } >> "$GITHUB_OUTPUT"
          echo "동작: $ACTION / 서버 요청: $REMOTE"

      # 테스트를 통과한 main의 커밋만 배포한다. 체크 이름이 아니라 그 커밋의 실제 CI 실행(ci.yml, main push)을 찾아
      # 그 실행의 작업 결과를 본다 (다른 워크플로·앱이 같은 이름의 체크를 올려도 속지 않음, PR #58 리뷰 P2).
      # 서버의 강제 명령도 main 포함 여부를 다시 확인한다.
      - name: CI 실행·main 포함 확인
        if: steps.req.outputs.action == 'deploy'
        env:
          SHA: ${{ steps.req.outputs.sha }}
          EVENT: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          status="$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)"
          case "$status" in identical|ahead) ;; *) echo "::error::$SHA 는 main에 포함된 커밋이 아닙니다 ($status)"; exit 1 ;; esac
          if [ "$EVENT" = "workflow_run" ]; then
            RUN_ID="$TRIGGER_RUN_ID"
          else
            RUN_ID="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::$SHA 의 성공한 CI 실행(ci.yml, main push)을 찾지 못했습니다"; exit 1; }
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '[.path, .event, .head_branch, .head_sha, .conclusion, .head_repository.full_name] | @tsv')"
          expected="$(printf '%s\t%s\t%s\t%s\t%s\t%s' .github/workflows/ci.yml push main "$SHA" success "$REPO")"
          [ "$run" = "$expected" ] || { echo "::error::CI 실행 $RUN_ID 이 이 커밋의 main push CI 성공 실행이 아닙니다"; exit 1; }
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | "\(.name)\t\(.conclusion)"' > jobs.txt
          for name in "린트 (ruff)" "테스트 (PostgreSQL 18)" "Docker 이미지 (빌드·스모크)"; do
            if ! grep -qxF "$name"$'\t'"success" jobs.txt; then
              echo "::error::CI 실행 $RUN_ID 의 '$name' 작업이 성공하지 않았습니다"; cat jobs.txt; exit 1
            fi
          done
          echo "CI 실행 $RUN_ID: 3개 작업 모두 성공, main에 포함된 커밋"

  deploy:
    name: 배포 (Self-hosted → Lightsail)
    needs: plan
    if: github.repository == 'yeeun5364/lemit' && needs.plan.outputs.remote != ''
    # 전용 라벨 lemit-deploy가 붙은 러너에서만 (docs/CD.md §2). 맞는 러너가 없으면 최대 24시간 기다린 뒤 실패한다
    runs-on: [self-hosted, Linux, X64, lemit-deploy]
    timeout-minutes: 20
    environment: production
    # 검증(plan)을 통과한 작업만 이 그룹에 들어온다 (PR #58 리뷰 P2: 검증 전 실행이 대기 배포를 밀어내지 않게).
    # 서버를 바꾸는 deploy·rollback은 한 그룹: 진행 중인 것은 취소하지 않고, 기다리는 것은 나중에 들어온 하나만 남는다.
    # 읽기 전용 check는 따로 둬서 대기 중인 배포를 밀어내지 않는다.
    concurrency:
      group: ${{ needs.plan.outputs.action == 'check' && 'deploy-production-check' || 'deploy-production' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HOST: ${{ vars.LIGHTSAIL_HOST }}
      SSH_USER: ${{ vars.LIGHTSAIL_USER }}
      ACTION: ${{ needs.plan.outputs.action }}
      SHA: ${{ needs.plan.outputs.sha }}
      REMOTE: ${{ needs.plan.outputs.remote }}
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
    steps:
      # 러너가 개인 개발 환경과 분리됐는지 매번 확인한다. 하나라도 아니면 배포 키를 쓰기 전에 멈춘다 (docs/CD.md §2, §4).
      # 이 확인은 배포 작업에만 있다. 승인된 포크 PR 작업은 이 단계를 거치지 않으므로 격리 자체가 방어선이다.
      # LEMIT_CHECK_MOUNTINFO·LEMIT_CHECK_BINFMT는 테스트용 (scripts/test_runner_isolation_check.py)
      - name: 러너 격리 확인
        run: |
          problems=""
          add() { problems="$problems $1;"; }
          [ "$(id -u)" != "0" ] || add "root로 실행 중"
          if id -nG | tr ' ' '\n' | grep -qxE 'sudo|wheel|admin|docker|lxd'; then add "관리자·docker 그룹 사용자"; fi
          # 비밀번호 없이 쓸 수 있는 sudo 권한이 하나라도 있으면 (명령 하나만 허용한 NOPASSWD 포함)
          if command -v sudo > /dev/null 2>&1 && sudo -n -l > /dev/null 2>&1; then add "비밀번호 없는 sudo 권한"; fi
          # Windows 드라이브 마운트: WSL2는 9p + aname=drvfs, 원본이 C:\ 형태 (/mnt 밖·fstab 마운트 포함).
          # 항상 있는 /usr/lib/wsl/drivers(aname=drivers, 읽기 전용 드라이버 저장소)는 제외한다
          mountinfo="${LEMIT_CHECK_MOUNTINFO:-/proc/self/mountinfo}"
          win="$(awk '{ s = 0; for (i = 1; i <= NF; i++) if ($i == "-") { s = i; break }
                        if (!s) next
                        if ($(s+1) == "drvfs" || $(s+3) ~ /(^|[,;])aname=drvfs/ || $(s+2) ~ /^[A-Za-z]:/) printf "%s ", $5 }' "$mountinfo")"
          [ -z "$win" ] || add "Windows 드라이브가 연결됨(${win% })"
          for f in "${LEMIT_CHECK_BINFMT:-/proc/sys/fs/binfmt_misc}"/WSLInterop*; do
            if [ -f "$f" ] && head -n 1 "$f" | grep -qx enabled; then add "Windows 프로그램 실행(interop)이 켜져 있음"; break; fi
          done
          for exe in powershell.exe cmd.exe wsl.exe; do
            if command -v "$exe" > /dev/null 2>&1; then add "Windows 프로그램($exe)이 PATH에 있음"; fi
          done
          if [ -n "$problems" ]; then
            echo "::error::러너가 격리되지 않았습니다:$problems 배포하지 않습니다 (docs/CD.md §2)"; exit 1
          fi
          echo "러너 격리 확인: 일반 사용자, 비밀번호 없는 sudo 없음, Windows 드라이브·프로그램 접근 없음"

      - name: 설정값·러너 도구 확인
        env:
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
          HAS_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY != '' }}
        run: |
          missing=""
          for v in HOST SSH_USER KNOWN_HOSTS; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ "$HAS_KEY" = "true" ] || missing="$missing LIGHTSAIL_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::production Environment 설정이 빠졌습니다:$missing (docs/CD.md §4)"; exit 1
          fi
          for t in ssh ssh-keygen git; do
            command -v "$t" > /dev/null || { echo "::error::러너에 $t 가 없습니다 (docs/CD.md §2)"; exit 1; }
          done

      # 러너 PC가 꺼져 있다가 늦게 켜진 경우: 그사이 main에 더 새 커밋이 들어왔으면 이 (오래된) 자동 배포는 건너뛴다.
      # 새 커밋의 CI가 성공하면 그 배포가 따로 실행된다. 수동 배포(workflow_dispatch)는 지정한 커밋을 그대로 배포한다.
      - name: 최신 main인지 확인 (자동 배포만)
        id: fresh
        run: |
          if [ "$EVENT" != "workflow_run" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          head="$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::main 최신 커밋을 확인하지 못했습니다"; exit 1; }
          if [ "$head" != "$SHA" ]; then
            echo "::notice::main에 더 새 커밋($head)이 있어 이 자동 배포($SHA)는 건너뜁니다. 새 커밋의 CI가 성공하면 배포됩니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 키는 이 단계 안에서만 새 임시 폴더에 만들고 쓰고 지운다. 이전 작업이 비정상 종료로 남긴 키 폴더도 먼저 지운다.
      # 러너의 SSH 설정·전역 known_hosts는 쓰지 않는다 (-F /dev/null, GlobalKnownHostsFile=/dev/null)
      - name: 서버에서 실행 (${{ needs.plan.outputs.action }})
        if: steps.fresh.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          rm -rf "$RUNNER_TEMP"/lemit-ssh.*            # 이전 작업이 비정상 종료로 남긴 키 폴더
          dir="$(mktemp -d "$RUNNER_TEMP/lemit-ssh.XXXXXXXX")"   # 새 폴더(700). 실패하면 여기서 중단 (bash -e)
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$dir/key" && printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts")
          unset SSH_KEY
          ssh-keygen -F "$HOST" -f "$dir/known_hosts" > /dev/null \
            || { echo "::error::LIGHTSAIL_KNOWN_HOSTS에 $HOST 의 호스트 키가 없습니다 (docs/CD.md §3-1)"; exit 1; }
          SSH=(ssh -F /dev/null -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
               -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
               -o ConnectTimeout=10 -o ServerAliveInterval=30 "$SSH_USER@$HOST")
          for i in 1 2 3; do
            "${SSH[@]}" status > /dev/null 2>&1 && break
            if [ "$i" = 3 ]; then
              echo "::error::SSH 연결 실패. 러너 PC의 공인 IP가 Lightsail 22번에 허용됐는지, 호스트 키·배포 키·authorized_keys를 확인하세요 (docs/CD.md §5)"
              exit 1
            fi
            sleep 5
          done
          "${SSH[@]}" "$REMOTE"

      - name: 정리 (임시 키 폴더가 남았으면 삭제)
        if: always()
        run: rm -rf "$RUNNER_TEMP"/lemit-ssh.*

      - name: 요약
        if: always()
        env:
          STATUS: ${{ job.status }}
          SKIPPED: ${{ steps.fresh.outputs.skip }}
        run: |
          {
            echo "### 배포 결과: $STATUS"
            if [ "$SKIPPED" = "true" ]; then echo "- **건너뜀:** main에 더 새 커밋이 있음 (새 커밋의 배포가 따로 실행됨)"; fi
            echo "- 동작: \`$ACTION\`"
            echo "- 서버 요청: \`$REMOTE\`"
            if [ -n "$SHA" ]; then echo "- 커밋: \`$SHA\`"; fi
            echo "- 서버 기록: \`deploy/state/history.log\` (check 동작으로 확인 가능)"
          } >> "$GITHUB_STEP_SUMMARY"
